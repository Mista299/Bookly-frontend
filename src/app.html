<!DOCTYPE html>
<html lang="es-ES">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#382C46" />
    <meta
      name="description"
      content="BOOKLY — gestión de reservas, servicios y agendas para salones de belleza."
    />

    <!-- PWA / instalación como app -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BOOKLY" />
    <meta name="application-name" content="BOOKLY" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Fuentes empaquetadas (static/fonts): el APK debe verse igual sin
         conexión. No se usa el CDN de Google Fonts a propósito. -->
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
